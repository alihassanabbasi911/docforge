# ============================================================
# flutter_native_splash configuration
# File: flutter_native_splash.yaml (project root)
# ============================================================
#
# SETUP:
#   1. Add to pubspec.yaml dev_dependencies:
#        flutter_native_splash: ^2.4.0
#
#   2. Place your icon PNG at: assets/splash/docforge_splash_logo.png
#      (white/light version on transparent background, ~400×400px,
#       the icon mark only — no background)
#
#   3. Run:
#        dart run flutter_native_splash:create
#
#   4. To revert (if needed):
#        dart run flutter_native_splash:remove
#
# The package generates:
#   Android: launch_background.xml + styles.xml patches
#   iOS:     LaunchScreen.storyboard replacement + Info.plist patches
#   Web:     index.html meta + loading CSS
# ============================================================

flutter_native_splash:
  # ── Colors ────────────────────────────────────────────────
  # Background color for the splash — matches DocForge dark indigo
  color: "#4F46E5"

  # Dark mode background (same — always dark for splash)
  color_dark: "#4F46E5"

  # ── Logo image ────────────────────────────────────────────
  # White/light version of the DocForge logo mark (transparent bg)
  # Recommended: 400×400 SVG converted to PNG, or 400×400 @3x PNG
  image: assets/splash/docforge_splash_logo.png

  # Dark mode image (same — already light-colored)
  image_dark: assets/splash/docforge_splash_logo.png

  # ── Sizing ────────────────────────────────────────────────
  # Android: pixel size of splash image
  android_12:
    # Android 12+ uses SplashScreen API
    image: assets/splash/docforge_splash_logo.png
    color: "#4F46E5"
    image_dark: assets/splash/docforge_splash_logo.png
    color_dark: "#4F46E5"
    # Icon background (shown behind adaptive icon on Android 12+)
    icon_background_color: "#4F46E5"
    icon_background_color_dark: "#4F46E5"
    # Branding image shown at bottom (optional wordmark)
    # branding: assets/splash/docforge_wordmark.png
    # branding_dark: assets/splash/docforge_wordmark.png

  # ── Status bar ────────────────────────────────────────────
  # Light icons (white) on dark background

  ios_content_mode: center

  # ── Web ───────────────────────────────────────────────────
  web: false # set true if deploying to web

  # ── Fullscreen ────────────────────────────────────────────
  # Hide status bar during splash
  fullscreen: false

  # ── Platforms ─────────────────────────────────────────────
