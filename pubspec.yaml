name: docforge
description: Intelligent Document OCR & Conversion App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.4.0
  file_picker: ^11.0.2
  flutter_pdf_text: ^0.9.0
  doc_text_extractor: ^2.1.0
  path_provider: ^2.1.5
  google_mlkit_text_recognition: ^0.15.1
  pdfrx: ^2.2.24
  camera: ^0.12.0+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  share_plus: ^12.0.2
  firebase_core: ^4.8.0
  firebase_auth: ^6.5.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
